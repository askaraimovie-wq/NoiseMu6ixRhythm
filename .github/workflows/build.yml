name: Build KINETIK VST3

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      version_tag:
        description: "Optional version override"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-windows-vst3:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Sequential Version
        id: ver
        shell: pwsh
        run: |
          $manual = "${{ github.event.inputs.version_tag }}"
          if (-not [string]::IsNullOrWhiteSpace($manual)) {
            $verStr = if ($manual.StartsWith("v")) { $manual } else { "v$manual" }
          } else {
            $verFile = if (Test-Path ".rythme_version") { ".rythme_version" } else { ".kinetik_version" }
            if (Test-Path $verFile) {
              $raw = (Get-Content $verFile -Raw).Trim()
              if ($raw -match '^v?(\d+)\.(\d+)\.(\d+)$') {
                $maj = [int]$Matches[1]
                $min = [int]$Matches[2]
                $pat = [int]$Matches[3] + 1
                $verStr = "v$maj.$min.$pat"
              } else {
                $verStr = "v1.2.6"
              }
            } else {
              $verStr = "v1.2.6"
            }
            Set-Content -Path $verFile -Value $verStr -NoNewline
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add $verFile
            git commit -m "chore: bump version to $verStr [skip ci]"
            git push
          }
          "ver_str=$verStr" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DKINETIK_VERSION_STR="${{ steps.ver.outputs.ver_str }}"

      - name: Build VST3 Plugin
        run: cmake --build build --config Release --target KINETIK_VST3 --parallel

      - name: Verify Versioned VST3 Output
        shell: pwsh
        run: |
          $ver = "${{ steps.ver.outputs.ver_str }}"
          $vstDir = "build/KINETIK_artefacts/Release/VST3"
          $src = Get-ChildItem -Path $vstDir -Filter "*.vst3" | Select-Object -First 1
          if ($null -ne $src) {
            $targetName = "KINETIK $ver.vst3"
            if ($src.Name -ne $targetName) {
              $dst = Join-Path $vstDir $targetName
              if (Test-Path $dst) { Remove-Item -Recurse -Force $dst }
              Rename-Item -Path $src.FullName -NewName $targetName
            }
          }

      - name: Upload VST3 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KINETIK ${{ steps.ver.outputs.ver_str }}
          path: build/KINETIK_artefacts/Release/VST3/*.vst3
